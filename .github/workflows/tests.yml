# Runs the test suite on GitHub's computers every time code is pushed
# or a pull request is opened. A green tick means all tests passed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The CPU-only build of PyTorch is much smaller than the default one,
      # and the network is small enough that a GPU wouldn't help.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run the one-file version end to end
        run: python start_here.py
